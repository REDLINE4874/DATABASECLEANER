<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataCleaner</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/table.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header class="app-header">
    <h1>DataCleaner</h1>
    <p id="file-label" class="file-label">Ningún archivo cargado</p>
    <button id="theme-btn" class="btn btn-sm" type="button">Tema oscuro</button>
  </header>

  <main>
    <section id="import-area" class="dropzone" aria-label="Importar CSV">
      <p><strong>Arrastra uno o más archivos CSV aquí</strong> o elígelos. Cada archivo se carga como una base independiente y se procesa solo en tu navegador.</p>
      <button id="pick-btn" class="btn btn-primary" type="button">Cargar archivos CSV</button>
      <input id="file-input" type="file" multiple accept=".csv,.tsv,.txt,text/csv" hidden>
    </section>

    <section id="stats" class="stats" aria-label="Estadísticas" hidden></section>
    <details id="import-report" class="report" hidden></details>

    <nav id="toolbar" class="toolbar" aria-label="Herramientas de depuración" hidden>
      <button id="filter-btn" class="btn" type="button">Filtrar columna…</button>
      <button id="dup-btn" class="btn" type="button">Buscar duplicados…</button>
      <button id="merge-btn" class="btn" type="button">Combinar bases…</button>
      <button id="cols-btn" class="btn" type="button">Conservar columnas…</button>
      <button id="export-btn" class="btn" type="button">Exportar CSV…</button>
      <button id="undo-btn" class="btn" type="button" disabled>Deshacer última eliminación</button>
      <button id="restore-btn" class="btn" type="button">Restaurar datos originales</button>
    </nav>
    <details id="history" class="report" hidden><summary>Historial de operaciones</summary><ol id="history-list"></ol></details>

    <div id="bases-wrap" hidden>
      <p class="hint">Bases cargadas (haz clic para trabajar con una; todas permanecen abiertas):</p>
      <div id="bases" class="tabs"></div>
    </div>

    <section id="table-section" class="table-section" aria-label="Tablas">
      <div id="tabs" class="tabs" hidden></div>
      <div id="table-root"></div>
    </section>
    
  </main>

  <dialog id="modal" aria-labelledby="modal-title">
    <h2 id="modal-title" class="modal-title"></h2>
    <div class="modal-body"></div>
    <div class="modal-actions"></div>
  </dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="lib/papaparse.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
